<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>MMD Desk Pet</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      user-select: none;
      touch-action: none;
    }

    #renderCanvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas" tabindex="0"></canvas>
  <script>
    (() => {
      const post = (payload) => {
        try {
          if (window.chrome?.webview) {
            window.chrome.webview.postMessage(payload);
          }
        } catch {
          // Bridge failures must not recurse through console.error.
        }
      };
      const describe = (value) => {
        if (value instanceof Error) {
          return value.stack || value.message;
        }
        if (typeof value === "string") {
          return value;
        }
        try {
          return JSON.stringify(value);
        } catch {
          return String(value);
        }
      };
      const originalError = console.error.bind(console);
      console.error = (...args) => {
        originalError(...args);
        post({
          type: "console-error",
          message: args.map(describe).join(" ")
        });
      };
      window.addEventListener("error", (event) => {
        const error = event.error;
        post({
          type: "runtime-error",
          operation: "window-error",
          message: String(event.message || error || "window error"),
          stack: error && error.stack ? error.stack : ""
        });
      });
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        post({
          type: "runtime-error",
          operation: "unhandled-rejection",
          message: reason instanceof Error ? reason.message : String(reason),
          stack: reason instanceof Error && reason.stack ? reason.stack : ""
        });
      });
    })();
  </script>
  <script src="./mmd.bundle.js"></script>
</body>
</html>
